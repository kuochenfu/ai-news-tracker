name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Runs at 06:00 and 18:00 Asia/Taipei (22:00 and 10:00 UTC) every day.
    - cron: "0 10,22 * * *"

permissions:
  # contents: write pushes refresh history to the `data` branch.
  contents: write
  # actions: write re-enables this workflow so GitHub's 60-day inactivity rule never pauses the schedule.
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      DATA_DIR: .data
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

      - name: Load refresh history
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            echo "No data branch yet; this refresh starts history."
            mkdir -p "$DATA_DIR"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Refresh trend snapshot
        run: npm run refresh

      - name: Validate
        run: |
          npm test
          DATABASE_URL="${DATABASE_URL:-postgresql://user:password@localhost:5432/ai_news_tracker}" npx prisma validate
          npm audit --omit=dev

      - name: Build static site
        run: npm run build

      - name: Save refresh history
        # Only after a successful build, so a broken refresh never becomes the baseline.
        # The branch holds one squashed commit: history lives in observations.json, not in git history.
        run: |
          tmp="$(mktemp -d)"
          cp "$DATA_DIR"/*.json "$tmp"/
          cd "$tmp"
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" data

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
